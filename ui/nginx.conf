server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /ask {
        proxy_pass https://p01--recipe-qa-service--yjw6rjx4dx4m.code.run;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 130s;
    }

    location /health {
        proxy_pass https://p01--recipe-qa-service--yjw6rjx4dx4m.code.run/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = / {
        rewrite ^ /index.html last;
    }

    location / {
        try_files $uri /index.html;
    }
}
