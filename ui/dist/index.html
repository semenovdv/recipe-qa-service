<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Recipe answers grounded in the Wikibooks Cookbook." />
    <title>Recipe Q&amp;A</title>
    <script type="module" crossorigin src="/assets/index-8OurKubn.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BcCe-M85.css">
  </head>
  <body>
    <div class="app-shell">
      <main class="workspace">
        <header class="topbar"><div class="mobile-brand"><span class="brand-mark">✦</span> Recipe Q&amp;A</div><label class="mode-toggle"><input id="advanced-mode" type="checkbox" /><span class="toggle-track"></span><span>Advanced mode</span></label><span class="model-pill"><span class="pulse"></span> Cookbook mode</span></header>
        <section id="conversation" class="conversation" aria-live="polite">
          <div id="welcome" class="welcome">
            <div class="welcome-icon">✦</div>
            <h1>What can I cook?</h1>
            <p>Ask anything about the recipes in your cookbook.</p>
            <div class="suggestions">
              <button class="suggestion" type="button" data-question="What vegetarian dinner can I make in under 30 minutes?"><span>◒</span><b>Quick &amp; vegetarian</b><small>Find a dinner under 30 minutes</small></button>
              <button class="suggestion" type="button" data-question="How do I make Alfredo sauce?"><span>◌</span><b>Cook a classic</b><small>Get a recipe with clear steps</small></button>
              <button class="suggestion" type="button" data-question="Compare the two Baingan Bartha recipes in the cookbook."><span>⇄</span><b>Compare recipes</b><small>See how two dishes differ</small></button>
              <button class="suggestion" type="button" data-question="Find me a vegan dessert."><span>◇</span><b>Dietary ideas</b><small>Browse recipes that fit your needs</small></button>
            </div>
          </div>
          <div id="status" class="status" aria-live="polite" hidden></div>
          <section id="user-message" class="user-message" hidden>
            <div id="user-question" class="user-bubble"></div>
          </section>
          <section id="result" class="result" hidden>
            <div class="message-avatar assistant-avatar">✦</div>
            <div class="message-content">
              <div class="message-meta">Recipe Q&amp;A <span>·</span> grounded answer</div>
              <div id="refusal" class="refusal" hidden></div>
              <div id="answer" class="answer"></div>
              <div id="citations" class="citations" hidden><h2>Sources</h2><ul id="citation-list"></ul></div>
            </div>
          </section>
        </section>
        <form id="ask-form" class="composer-wrap">
          <div class="composer">
            <textarea id="question" name="question" rows="1" maxlength="1000" placeholder="Ask about a recipe…" required></textarea>
            <button id="submit-button" class="send-button" type="submit" aria-label="Send question">↑</button>
          </div>
          <p class="composer-hint">Answers are based only on the cookbook corpus.</p>
        </form>
      </main>
      <aside class="trace-panel" aria-label="Request trace">
        <div class="trace-heading"><span>Request trace</span><span class="trace-live"><i></i> live</span></div>
        <p class="trace-empty" id="trace-empty">Stages and timings will appear here after you ask a question.</p>
        <ol id="trace-list" class="trace-list" hidden></ol>
      </aside>
    </div>
  </body>
</html>
