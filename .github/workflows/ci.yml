name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: pip install black ruff mypy pip-audit detect-secrets
      - run: black --check app dataset scripts
      - run: ruff check app dataset scripts
      - run: mypy app --ignore-missing-imports --no-error-summary
      - run: pip-audit -r requirements.txt
      - run: detect-secrets scan --all-files --exclude-files '(^|/)\\.env$' --exclude-files '(^|/)node_modules/'
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: docker build --tag recipe-qa-api:ci .
      - run: docker build --tag recipe-qa-ui:ci ./ui
