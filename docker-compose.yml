services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: recipe_qa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipe_qa_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - recipe_qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recipe_qa"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  seed:
    build:
      context: .
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required for seeding}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-recipe_qa_dev}@db:5432/recipe_qa
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "scripts.db_seed", "--apply"]
    restart: "no"

  api:
    build:
      context: .
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-recipe_qa_dev}@db:5432/recipe_qa
      CORPUS_INDEX_PATH: dataset/corpus/index.json
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  ui:
    build:
      context: ./ui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${UI_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  recipe_qa_pgdata:
